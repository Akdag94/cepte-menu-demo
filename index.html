    `<div class="grid">${list.map((p, i) => cardHTML(p, null, ilk + i < 4)).join('')}</div>`;

  if (!c.subs || state.sort !== 'menu') return gridler(items, 0);

  let n = 0;
  return c.subs.map((key) => {
    const bolum = items.filter((p) => p.sub === key);
    if (!bolum.length) return '';
    const bas = n;
    n += bolum.length;
    return `<section class="sub">
      <i class="sub__mark" aria-hidden="true"></i>
      <h2 class="subhead">
        <span class="subhead__dot" aria-hidden="true"></span>
        <span class="subhead__name">${esc(subLabel(key))}</span>
        <span class="subhead__rule" aria-hidden="true"></span>
        <span class="subhead__n">${esc(t().products(bolum.length))}</span>
      </h2>
      ${gridler(bolum, bas)}
    </section>`;
  }).join('');
}

// Alt başlık etiketleri altı dilde derlemeden geliyor; ürün adlarının aksine
// kimliğe değil anahtara bağlılar, o yüzden ayrı bir sözlükte duruyorlar.
const subLabel = (key) => {
  const l = DATA.subs?.[key];
  return l ? (l[state.lang] || l.en || l.tr || key) : key;
};

// The items the restaurant itself flagged, surfaced before the categories so
// a guest with no idea what to order has somewhere to start.
/* Şefin seçimi ve popülerler. Dokuzda kesiliyor: bir destede gözün takip
   edebileceğinden fazlası zaten görünmüyor, ama her biri DOM'da duruyor. */
const PICK_LIMIT = 9;

function picksHTML() {
  const picks = DATA.categories
    .flatMap((c) => c.products.filter((p) => (p.chef || p.popular) && matches(p)));
  if (!picks.length) return '';
  picks.sort((a, b) => (b.chef - a.chef) || (b.clicks - a.clicks));
  const list = picks.slice(0, PICK_LIMIT);

  const cards = list.map((p, i) => {
    // Duruş sayfaya basılı geliyor; JS yüklenmeden de deste doğru duruyor.
    const pose = coverPose(i, 0, list.length);
    const style = `transform:${pose.transform};opacity:${pose.opacity};z-index:${pose.zIndex}`;
    return `<button class="pick3d__card${pose.on ? ' is-on' : ''}" style="${style}"
        data-ci="${i}" data-product="${esc(p.id)}" aria-hidden="${pose.on ? 'false' : 'true'}"
        tabindex="${pose.on ? 0 : -1}">
      ${imgTag(p.image, nameOf(p), 'pick3d__img', null, true)}
      <span class="pick3d__veil"></span>
      <span class="pick3d__flag">${esc(p.chef ? t().chef : t().popular)}</span>
      <span class="pick3d__in">
        <span class="pick3d__name">${esc(nameOf(p))}</span>
        <span class="pick3d__rule"></span>
        <span class="pick3d__price">${esc(priceText(p))}</span>
      </span>
    </button>`;
  }).join('');

  const dots = list.map((_, i) =>
    `<button class="pick3d__dot${i === 0 ? ' is-on' : ''}" data-cdot="${i}"
       aria-label="${esc(nameOf(list[i]))}"></button>`).join('');

  return `
    <section class="pick3d" id="pick3d" role="region"
      aria-roledescription="galeri" aria-label="${esc(t().picks)}">
      <h2 class="pick3d__title">${esc(t().picks)}</h2>
      ${list.length > 1 ? `
        <button class="pick3d__hold" id="pick3dHold" aria-pressed="false"
          aria-label="${esc(t().pauseCarousel)}">
          <svg class="pick3d__hold-i" width="13" height="13" viewBox="0 0 24 24"
            fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
          <svg class="pick3d__hold-o" width="13" height="13" viewBox="0 0 24 24"
            fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
        </button>` : ''}
      <div class="pick3d__stage" id="pick3dStage">${cards}</div>
      ${list.length > 1 ? `
        <button class="pick3d__nav pick3d__nav--prev" data-cnav="-1" aria-label="${esc(t().prev)}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button class="pick3d__nav pick3d__nav--next" data-cnav="1" aria-label="${esc(t().next)}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <div class="pick3d__dots">${dots}</div>` : ''}
    </section>`;
}

/* Desteyi konumlandırır. Her kartın yeri merkeze olan uzaklığından hesaplanıyor;
   iki adımdan uzaktakiler tamamen saklanıyor — görünmeyen kartı animasyonlu
   tutmanın bedeli var, faydası yok. */
let coverIndex = 0;
let coverTimer = null;
let coverCount = 0;

// Kart 138px; uzaklıklar buna oranlı. Kart küçülüp bunlar sabit kalırsa deste
// dağılır, büyüyüp sabit kalırsa kartlar üst üste biner.
const COVER_STEPS = [
  { x: 0,    z: 0,    s: 1,    r: 0,   o: 1,   zi: 30 },
  { x: 110,  z: -80,  s: .82,  r: -28, o: .72, zi: 20 },
  { x: 186,  z: -170, s: .64,  r: -42, o: .34, zi: 10 },
];

/* Bir kartın merkeze uzaklığından duruşunu verir.
   Hem HTML üretilirken hem çalışırken aynı fonksiyon kullanılıyor: konumlar
   sayfaya basılı geliyor, JS sonradan "düzeltmiyor". Aksi hâlde ilk boyamada
   bütün kartlar ortada üst üste duruyor, betik koşunca yerlerine fırlıyordu —
   menüye girer girmez görülen ani sıçrama buydu. */
function coverPose(i, index, count) {
  let d = i - index;
  if (d > count / 2) d -= count;
  if (d < -count / 2) d += count;

  const sign = d < 0 ? -1 : 1;
  const far = Math.abs(d) > 2;
  if (far) {
    return { transform: `translate3d(${sign * 240}px,0,-240px) scale(.58)`,
             opacity: 0, zIndex: 0, on: false };
  }
  const s = COVER_STEPS[Math.abs(d)];
  return {
    transform: `translate3d(${sign * s.x}px, 0, ${s.z}px) ` +
               `rotateY(${sign * s.r}deg) scale(${s.s})`,
    opacity: s.o, zIndex: s.zi, on: d === 0,
  };
}

function layoutCover(animate = true) {
  const stage = $('pick3dStage');
  if (!stage) return;
  const cards = stage.children;
  coverCount = cards.length;

  for (let i = 0; i < coverCount; i++) {
    const card = cards[i];
    const pose = coverPose(i, coverIndex, coverCount);

    if (!animate) card.style.transition = 'none';
    card.style.transform = pose.transform;
    card.style.opacity = String(pose.opacity);
    card.style.zIndex = String(pose.zIndex);
    card.classList.toggle('is-on', pose.on);
    card.setAttribute('aria-hidden', pose.on ? 'false' : 'true');
    card.tabIndex = pose.on ? 0 : -1;
    if (!animate) { void card.offsetWidth; card.style.transition = ''; }
  }

  const dots = document.querySelectorAll('[data-cdot]');
  dots.forEach((el, i) => el.classList.toggle('is-on', i === coverIndex));
}

function coverGo(delta) {
  if (coverCount < 2) return;
  coverIndex = (coverIndex + delta + coverCount) % coverCount;
  layoutCover();
  restartCoverAuto();
}

function coverTo(i) {
  if (i === coverIndex) return;
  coverIndex = i;
  layoutCover();
  restartCoverAuto();
}

/* Kendiliğinden ilerleme. Beş saniyede bir tek transform değişimi — kare
   başına maliyeti yok. Dokunulduğunda duruyor ki okuyanın altından kaymasın,
   hareket azaltma açıksa hiç başlamıyor. */
/* Duraklatma bir bayrakla tutuluyor, yalnızca zamanlayıcıyı temizleyerek
   değil: her ilerleme adımı sonunda `restartCoverAuto` çağrılıyor ve o çağrı
   duraklatmayı sessizce eziyordu — odak destenin üzerindeyken bile dönmeye
   devam ediyordu. Bayrak, "kim yeniden başlatmak isterse istesin, kullanıcı
   burada" demenin yolu. */
let coverPaused = false;
// Kullanıcının düğmeyle verdiği karar. `coverPaused` imleç çekilince kalkar,
// bu kalkmaz.
let coverHeld = false;

function restartCoverAuto() {
  clearInterval(coverTimer);
  if (REDUCED || coverCount < 2 || coverPaused || coverHeld) return;
  coverTimer = setInterval(() => coverGo(1), 5000);
}
function stopCoverAuto() { clearInterval(coverTimer); coverTimer = null; }

function pauseCover() { coverPaused = true; stopCoverAuto(); }

/* Kart açıkken deste hiç dönmemeli — perdenin arkasında dönen bir şey, kartın
   kenarından görünüyor ve kart kapandığında karşılaşılan deste artık aynı
   deste olmuyor.

   Duruşu bozan şey kartın kendisiydi: kart açılırken `document.body`ye
   taşınıyor, taşınan öğe odağını kaybediyor ve `focusout` desteye düşüyor —
   "odak dışarı çıktı, dönmeye devam et" diye okunuyordu. Karar tek yerde
   toplandı: açık kart varken sürdürme isteği geri çevriliyor. */
function resumeCover() {
  if (acikKart) return;
  coverPaused = false;
  restartCoverAuto();
}

function initCover3d() {
  coverIndex = 0;
  coverPaused = false;
  // coverHeld sıfırlanmıyor: dil ya da filtre değişince deste yeniden
  // kuruluyor ve kullanıcının "dur" demesi her seferinde silinirdi.
  stopCoverAuto();
  const stage = $('pick3dStage');
  if (!stage) { coverCount = 0; return; }
  layoutCover(false);
  restartCoverAuto();

  /* Kendiliğinden hareket eden bir şeyin durdurulabilir olması gerekiyor
     (WCAG 2.2.2). Dokunmak zaten durduruyordu ama klavyeyle gezen ya da
     fareyle okuyan biri için hiçbir yolu yoktu: deste altından kayıp
     gidiyordu. Odak ya da imleç içerideyken duruyor, çıkınca sürüyor. */
  const bolge = $('pick3d');
  if (!bolge || bolge.dataset.wired) return;
  bolge.dataset.wired = '1';

  /* Bu düğme, imleç ve odakla gelen geçici duraklatmadan farklı: kullanıcı
     bir kez bastıysa deste, imleç çekilince yeniden başlamamalı. Bu yüzden
     kendi bayrağı var ve `resumeCover` ona bakıyor. */
  const hold = $('pick3dHold');
  if (hold && coverHeld) {
    // Deste yeniden kuruldu ve düğme sıfırdan geldi; kullanıcının kararı
    // duruyor, düğmenin görünüşü de ona uymalı.
    hold.setAttribute('aria-pressed', 'true');
    hold.setAttribute('aria-label', t().playCarousel);
  }
  if (hold) hold.addEventListener('click', () => {
    coverHeld = !coverHeld;
    hold.setAttribute('aria-pressed', String(coverHeld));
    hold.setAttribute('aria-label', coverHeld ? t().playCarousel : t().pauseCarousel);
    if (coverHeld) pauseCover(); else resumeCover();
  });

  bolge.addEventListener('mouseenter', pauseCover);
  bolge.addEventListener('mouseleave', resumeCover);

  /* Yalnız klavye odağı durduruyor. Dokunmak da odak veriyor ve kart
     kapanınca odak kartın kendisine dönüyor: her ikisi de "odak destede"
     sayılınca, bir kez ürüne dokunan misafirde deste bir daha hiç
     dönmüyordu. Klavyeyle gezen için durması ise şart — altından kayan bir
     şeye Sekme'yle yetişilmiyor.

     `:focus-visible` tanınmayan bir tarayıcıda seçici hata veriyor; o
     durumda eski davranışa, yani durdurmaya düşülüyor. */
  const klavyeOdagi = () => {
    try { return !!bolge.querySelector(':focus-visible'); } catch { return true; }
  };
  bolge.addEventListener('focusin', () => { if (klavyeOdagi()) pauseCover(); });
  bolge.addEventListener('focusout', (e) => {
    if (!bolge.contains(e.relatedTarget)) resumeCover();
  });

  // Ok tuşları desteyi çevirir. Sayfanın kendi ok tuşu kısayolu kategori
  // değiştiriyor; deste odaktayken onun önüne geçmesi gerekiyor.
  bolge.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const rtl = getComputedStyle(document.documentElement).direction === 'rtl';
    const ileri = (e.key === 'ArrowRight') !== rtl;
    coverGo(ileri ? 1 : -1);
    // Merkeze gelen kart odağı alsın ki okuyucu değişimi duyursun.
    $('pick3dStage')?.querySelector('.is-on')?.focus();
    e.preventDefault();
    e.stopPropagation();
  });
}

/* ================================================================ views = */
function renderPage() {
  const page = $('page');
  const hits = searchHits();

  if (hits) {                                     /* --- search results --- */
    $('pager').hidden = true;
    setMood(null);
    page.innerHTML = `
      <div class="page__head">
        <div class="page__eyebrow">${esc(t().search.replace('…', ''))}</div>
        <h1 class="page__title">${esc(state.query)}</h1>
        <p class="page__sub">${esc(t().results(hits.length))}</p>
      </div>
      ${hits.length
        ? `<div class="grid">${hits.map(({ p, c }) => cardHTML(p, nameOf(c))).join('')}</div>`
        : `<div class="empty">${ICON.search}<h3>${esc(t().noResults)}</h3><p>${esc(t().noResultsHint)}</p></div>`}
    `;
    return;
  }

  if (state.view === 'home') {                    /* --- all categories --- */
    $('pager').hidden = false;
    setMood(null);
    const total = totalProducts();
    const shown = totalVisible();
    page.innerHTML = `
      <div class="page__head">
        <h1 class="page__title">${esc(DATA.restaurant.name)}</h1>
        <p class="page__sub">${esc(t().menuOf(DATA.categories.length, shown === total ? total : shown))}</p>
      </div>
      ${picksHTML()}
      <div class="cats">${DATA.categories.map((c, i) => {
        const n = visibleIn(c).length;
        return `<button class="cat" data-goto="${i}">
          ${imgTag(c.image, nameOf(c), 'cat__img')}
          <span class="cat__shade"></span>
          <span class="cat__label">
            <span class="cat__name">${esc(nameOf(c))}</span>
            <span class="cat__count">${esc(t().products(n))}</span>
          </span>
        </button>`;
      }).join('')}</div>
    `;
    applyMotion();
    initCover3d();
    renderPager();
    return;
  }

  $('pager').hidden = false;
  const cat = DATA.categories[state.page];
  const items = visibleIn(cat);
  setMood(cat.mood);

  page.innerHTML = `
    <div class="page__head">
      <h1 class="page__title">${esc(nameOf(cat))}</h1>
      <p class="page__sub">${cat.desc && state.lang === 'tr'
        ? esc(cat.desc) : esc(t().products(items.length))}</p>
      ${cat.mood ? '<div class="page__rule"></div>' : ''}
    </div>
    ${items.length
      ? gridHTML(cat, items)
      : `<div class="empty">${ICON.filterBig}
           <h3>${esc(t().emptyPage)}</h3>
           <p>${esc(t().emptyPageHint)}</p>
           <button class="btn btn--primary" id="jumpBtn">${esc(nextMatchingIndex() != null ? t().nextMatch : t().clearFilters)}</button>
         </div>`}
  `;

  const jump = $('jumpBtn');
  if (jump) jump.addEventListener('click', () => {
    const i = nextMatchingIndex();
    if (i == null) { resetFilters(); } else { go(i); }
  });

  applyMotion();
  watchSubheads();
  renderPager();
}

/* Başlığın yapıştığı anı yakalar. Kaydırma sırasında ölçüm yapılmıyor:
   bölümün tepesindeki görünmez işaret üst çubuğun altına girdiğinde tarayıcı
   kendiliğinden haber veriyor — kaydırma dinleyicisi yok, düzen okuması yok. */
let subWatcher;

function watchSubheads() {
  subWatcher?.disconnect();
  const isaretler = $('page').querySelectorAll('.sub__mark');
  if (!isaretler.length) return;
  // Gözcüsü olmayan tarayıcıda zemin hep açık kalıyor: yapışıp yapışmadığını
  // bilemediğimiz bir başlığın fotoğrafın üstünde okunaksız kalmasındansa,
  // akıştayken de zeminli durması iyi.
  if (!('IntersectionObserver' in window)) {
    $('page').querySelectorAll('.subhead').forEach((h) => h.classList.add('subhead--stuck'));
    return;
  }

  const ust = parseFloat(
    getComputedStyle(document.documentElement).getPropertyValue('--stick')) || 106;

  subWatcher = new IntersectionObserver((girisler) => {
    for (const g of girisler) {
      // Kesişmemek iki şey olabilir: yukarı çıkmış (başlık yapışık) ya da
      // aşağıda, sırası daha gelmemiş.
      const yapisik = !g.isIntersecting && g.boundingClientRect.top <= ust;
      g.target.nextElementSibling?.classList.toggle('subhead--stuck', yapisik);
    }
  }, { rootMargin: `-${Math.round(ust)}px 0px 0px 0px` });

  isaretler.forEach((m) => subWatcher.observe(m));
}

/* Page arrives from the side you came from; cards settle in as they scroll
   into view, staggered within each screenful. */
/* Cross-fades the atmosphere by handing the incoming mood to whichever layer
   is currently hidden and swapping which one is lit. Only opacity moves, so
   the gradients are painted once each and never re-rasterised mid-change. */
let moodLayer = 0;
let moodNow = undefined;

function setMood(mood) {
  if (mood === moodNow) return;
  moodNow = mood;

  // Content reads the hue from here; the layers carry their own so the one
  // fading out keeps its colour all the way through.
  const app = document.querySelector('.app');
  if (mood) app.dataset.mood = mood; else delete app.dataset.mood;

  const layers = [$('atmosA'), $('atmosB')];
  // No mood — the home page and search results, which span every category and
  // belong to none. Both layers go out and the page is simply itself.
  if (!mood) {
    layers.forEach((l) => l.classList.remove('atmos__layer--on'));
    return;
  }

  const incoming = layers[moodLayer ^ 1];
  incoming.dataset.mood = mood;
  layers[moodLayer].classList.remove('atmos__layer--on');
  incoming.classList.add('atmos__layer--on');
  moodLayer ^= 1;
}

let cardWatcher;
// The menu renders behind the splash, so its tiles are already intersecting
// the viewport. Left alone they would finish settling while the guest is
// still reading the welcome screen, and the first thing seen would be a
// static grid. The reveal is held until the splash lifts.
let splashUp = false;

function applyMotion() {
  const page = $('page');
  page.classList.remove('page--next', 'page--prev');
  const sliding = !!state.dir && !REDUCED;
  if (sliding) {
    void page.offsetWidth;
    page.classList.add(state.dir > 0 ? 'page--next' : 'page--prev');
  }
  state.dir = 0;

  cardWatcher?.disconnect();
  if (splashUp) return;
  const cards = [...page.querySelectorAll('.card, .cat')];
  if (REDUCED || !cards.length || !('IntersectionObserver' in window)) return;

  let seen = 0;
  cardWatcher = new IntersectionObserver((entries, obs) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      // Stagger within a screenful, then reset so later rows stay snappy.
      e.target.style.animationDelay = `${Math.min(seen % 6, 5) * 55}ms`;
      e.target.classList.add(e.target.classList.contains('cat') ? 'cat--in' : 'card--in');
      seen++;
      obs.unobserve(e.target);
    }
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });

  // A card already on screen while the page itself is sliding in would be
  // animating inside an animating parent: two transforms on the same pixels,
  // which is both wasted compositing and visually busy. It rides the slide;
  // only what is still below the fold settles on its own.
  const fold = window.innerHeight;
  cards.forEach((c) => {
    if (sliding && c.getBoundingClientRect().top < fold) return;
    cardWatcher.observe(c);
  });
}

function nextMatchingIndex() {
  const n = DATA.categories.length;
  for (let step = 1; step < n; step++) {
    const i = (state.page + step) % n;
    if (visibleIn(DATA.categories[i]).length) return i;
  }
  return null;
}

const pagerTarget = { prev: null, next: null };

// The rail is rebuilt only when the language changes; rebuilding it on every
// render would reset the scroll position and kill the marker's transition
// mid-flight.
let railLang = null;
let markerPlaced = false;

// A category's own image is a generic plate shot. The first dish inside it is
// what the guest is actually choosing between, so that is what the chip wears.
const railImage = (c) => c.products.find((p) => p.image)?.image || c.image || '';

function buildRail() {
  $('railTrack').innerHTML = DATA.categories.map((c, i) => {
    const name = nameOf(c);
    return `<button class="rail__chip" role="tab" data-goto="${i}">
      ${imgTag(railImage(c), name, 'rail__img', 40)}
      <span class="rail__name">${esc(name)}</span>
    </button>`;
  }).join('');
  railLang = state.lang;
  markerPlaced = false;
}

/* Evaluates a CSS cubic-bezier in JS, so a scroll driven here can be given
   the exact curve the stylesheet uses. Newton-Raphson on x, then read y. */
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const fx = (t) => ((ax * t + bx) * t + cx) * t;
  const fy = (t) => ((ay * t + by) * t + cy) * t;
  const dfx = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (p) => {
    let t = p;
    for (let i = 0; i < 6; i++) {
      const d = fx(t) - p;
      if (Math.abs(d) < 1e-4) break;
      const s = dfx(t);
      if (Math.abs(s) < 1e-6) break;
      t -= d / s;
    }
    return fy(t);
  };
}

// CSS'teki --ease ve .rail__marker geçişiyle birebir aynı kalmalı: mekanizma
// tam olarak bu özdeşliğe dayanıyor, süsleme değil. Bkz. moveMarker.
const RAIL_EASE = bezier(0.32, 0.72, 0, 1);
const RAIL_MS = 340;
let railAnim = 0;

function scrollRail(to) {
  const rail = $('rail');
  const max = rail.scrollWidth - rail.clientWidth;
  const end = Math.max(0, Math.min(max, to));
  const from = rail.scrollLeft;
  const delta = end - from;

  cancelAnimationFrame(railAnim);
  if (Math.abs(delta) < 1) return;
  if (REDUCED) { rail.scrollLeft = end; return; }

  const t0 = performance.now();
  const step = (now) => {
    const p = Math.min(1, (now - t0) / RAIL_MS);
    rail.scrollLeft = from + delta * RAIL_EASE(p);
    if (p < 1) railAnim = requestAnimationFrame(step);
  };
  railAnim = requestAnimationFrame(step);
}

// A finger on the strip always wins over an animation still finishing.
$('rail').addEventListener('touchstart', () => cancelAnimationFrame(railAnim), { passive: true });
$('rail').addEventListener('wheel', () => cancelAnimationFrame(railAnim), { passive: true });

function moveMarker(chip) {
  const marker = $('railMarker');
  if (!chip) { marker.classList.remove('rail__marker--on'); return; }

  const rail = $('rail');

  /* The ring always glides — never snaps, wherever the chip sits.
     It travels in the strip's own content space, so what the eye sees is
     markerContent(t) − scroll(t). Letting those two run on unrelated curves
     is what produced the wobble, and snapping the ring was only a way of
     hiding it. Give both the same duration and the same easing f and the
     difference collapses to
         (A − S₀) + [(B − A) − (S₁ − S₀)] · f(t)
     which is one eased motion again. So the scroll is driven here, on the
     stylesheet's own curve, rather than handed to native smooth scrolling
     with its own uncontrolled timing. */
  const jump = !markerPlaced || REDUCED;
  marker.classList.toggle('rail__marker--still', jump);

  marker.style.width = `${chip.offsetWidth}px`;
  marker.style.height = `${chip.offsetHeight}px`;
  marker.style.transform = `translate3d(${chip.offsetLeft}px, 0, 0)`;
  marker.classList.add('rail__marker--on');

  if (jump) {
    // Two frames: one for the browser to commit the jump, one to be sure it
    // is painted before transitions are allowed back on.
    requestAnimationFrame(() => requestAnimationFrame(() =>
      marker.classList.remove('rail__marker--still')));
  }
  markerPlaced = true;

  // Only when the chip is not already sitting comfortably in view; scrolling a
  // strip that needs no scrolling would move the whole menu under the reader
  // for no reason.
  const edge = 28;
  const offLeft = chip.offsetLeft - rail.scrollLeft;
  if (offLeft >= edge && offLeft + chip.offsetWidth <= rail.clientWidth - edge) return;

  // Centre the active chip. Done by hand rather than scrollIntoView, which
  // also walks up and scrolls the ancestors.
  scrollRail(chip.offsetLeft - (rail.clientWidth - chip.offsetWidth) / 2);
}

function renderPager() {
  const n = DATA.categories.length;
  const home = state.view === 'home';

  // Arrow keys and swipes still walk one category at a time; the rail is for
  // jumping anywhere at once.
  //   target: category index | null
  pagerTarget.prev = home ? null : (state.page > 0 ? state.page - 1 : null);
  pagerTarget.next = home ? 0 : (state.page < n - 1 ? state.page + 1 : null);

  if (railLang !== state.lang) buildRail();

  const chips = $('railTrack').children;
  for (let i = 0; i < chips.length; i++) {
    const on = !home && i === state.page;
    chips[i].classList.toggle('rail__chip--on', on);
    chips[i].setAttribute('aria-selected', on ? 'true' : 'false');
  }
  moveMarker(home ? null : chips[state.page]);

  // Always named, never a page counter — the one control that must be
  // unmistakable is the way back to the top level.
  $('pagerCount').textContent = t().home;
  $('indexBtn').setAttribute('aria-label', t().home);
  $('indexBtn').classList.toggle('pager__index--on', home);
  $('indexBtn').setAttribute('aria-current', home ? 'page' : 'false');
}

function renderChrome() {
  const r = DATA.restaurant;
  const li = langInfo(state.lang);
  document.documentElement.lang = state.lang;
  document.documentElement.dir = li.dir;
  document.documentElement.classList.toggle('logo-light', !!r.logoLight);

  $('langCode').textContent = state.lang.toUpperCase();
  $('langBtn').setAttribute('aria-label', `${t().language}: ${li.label}`);

  // In the bar, not buried in the info panel: it is the one setting a guest
  // reaches for mid-meal, when the light in the room stops matching the
  // screen. The icon shows where it stands, and one tap moves it on.
  // Düğme, dokununca NE OLACAĞINI gösteriyor: koyudayken güneş, açıkken ay.
  const koyuMu = state.theme === 'dark'
    || (state.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  const themeIcon = { light: ICON.moon, dark: ICON.sun };
  const themeName = { light: t().themeDark, dark: t().themeLight };
  const anahtar = koyuMu ? 'dark' : 'light';
  $('themeBtn').innerHTML = themeIcon[anahtar];
  $('themeBtn').setAttribute('aria-label', `${themeName[anahtar]}`);

  $('brandLogo').src = r.logo || '';
  $('brandLogo').alt = r.name;
  $('brandName').firstElementChild.textContent = r.name;
  // bdi keeps the time range reading left-to-right inside RTL text, so
  // "12:00 – 22:30" does not flip into "22:30 – 12:00".
  $('brandMeta').innerHTML =
    `<i class="dot ${r.isOpen ? 'dot--open' : 'dot--closed'}"></i>` +
    `<span class="brand__state">${esc(r.isOpen ? t().openNow : t().closedNow)}</span>` +
    (r.hours ? ` <span class="brand__hours">· <bdi dir="ltr">${esc(r.hours)}</bdi></span>` : '');

  // The cover is mounted once, so its labels have to be refreshed here.
  if (!$('cover').hidden) $('coverLinks').innerHTML = socialLinksHTML();
  $('brandBtn').setAttribute('aria-label', `${r.name} — ${t().info}`);

  $('searchInput').placeholder = t().search;
  $('searchInput').setAttribute('aria-label', t().search);
  $('searchClear').setAttribute('aria-label', t().clear);

  const fc = filterCount();
  $('filterBtn').setAttribute('aria-label', `${t().filter}${fc ? ` (${fc})` : ''}`);
  $('filterBtn').classList.toggle('iconbtn--on', fc > 0);
  $('filterBadge').hidden = !fc;
  $('filterBadge').textContent = fc;

  const bar = $('activeBar');
  bar.hidden = fc === 0;
  if (fc) {
    $('activeText').innerHTML = t().activeOf(totalVisible(), totalProducts());
    $('activeClear').textContent = t().clear;
  }
  $('sheetClose').setAttribute('aria-label', t().close);
  stickOffset();
}

/* Yapışan iki şeyin yüksekliği: filtre şeridi üst çubuğun altına, alt
   başlıklar da ikisinin altına oturuyor. Ölçülüyor, yazılmıyor — üst çubuğun
   yüksekliği yazı boyuyla değişiyor ve sabit bir sayı, altındakini çubuğun
   arkasına sokuyor. */
function stickOffset() {
  const kok = document.documentElement.style;
  const bar = document.querySelector('.topbar')?.offsetHeight || 106;
  // `--bar` çubuğun rengi; yükseklik ayrı bir adla duruyor.
  kok.setProperty('--barh', `${bar}px`);
  const filtre = $('activeBar');
  const ek = filtre && !filtre.hidden ? filtre.offsetHeight : 0;
  kok.setProperty('--stick', `${bar + ek}px`);
}
// Yükseklik değişince yapışma çizgisi de değişiyor; gözcünün sınırı ona göre
// kurulduğu için yeniden kurulması gerekiyor.
addEventListener('resize', () => { stickOffset(); watchSubheads(); });

/* The photographs are the menu. Landing on a category and finding empty tiles
   while they download is the most visible break in navigation there is, and
   it lands on exactly the frames where the page is still fading up. The
   categories a guest is one swipe or one tap away from are fetched ahead of
   time so arrival is instant. */
const warmed = new Set();
let warmTimer;

function warmNeighbours() {
  clearTimeout(warmTimer);
  // Deferred: the page actually being looked at must win the connection first.
  warmTimer = setTimeout(() => {
    const around = state.view === 'home'
      ? [0, 1]
      : [state.page - 1, state.page + 1, state.page + 2];

    for (const i of around) {
      const c = DATA.categories[i];
      if (!c || warmed.has(i)) continue;
      warmed.add(i);
      // One screenful each; the rest still lazy-load on scroll as before.
      for (const p of visibleIn(c).slice(0, 6)) if (p.image) new Image().src = p.image;
    }
  }, 400);
}

/* Ekrana ne geldiğini söyler. Görsel kullanıcı başlığı okuyup anlıyor;
   ekran okuyucu kullanan için o başlık, imleç oraya götürülmediği sürece
   yok hükmünde. */
function duyur() {
  const el = $('say');
  if (!el) return;

  const hits = searchHits();
  let metin;
  if (hits) {
    metin = `${state.query} — ${t().results(hits.length)}`;
  } else if (state.view === 'home') {
    metin = `${DATA.restaurant.name} — ${t().menuOf(DATA.categories.length, totalVisible())}`;
  } else {
    const c = DATA.categories[state.page];
    metin = `${nameOf(c)} — ${t().products(visibleIn(c).length)}`;
  }

  // Aynı metni ikinci kez yazmak çoğu okuyucuda hiç okunmuyor: değişiklik
  // görmüyorlar. Önce boşaltıp sonraki karede doldurmak, iki kez üst üste
  // aynı kategoriye gelindiğinde de duyurunun düşmesini engelliyor.
  el.textContent = '';
  requestAnimationFrame(() => { el.textContent = metin; });
}

const render = () => { renderChrome(); renderPage(); warmNeighbours(); duyur(); };

/* ================================================================ sheet = */
let lastFocus = null;

function openSheet(kind, title, body, foot, kaynak) {
  lastFocus = document.activeElement;

  const sheet = $('sheet');
  const el = kaynak || lastFocus;
  if (el && el.getBoundingClientRect) {
    const r = el.getBoundingClientRect();
    const sr = sheet.getBoundingClientRect();
    // Panelin kendi genişliğine göre yüzde: transform-origin böyle çalışıyor.
    const yuzde = sr.width ? ((r.left + r.width / 2 - sr.left) / sr.width) * 100 : 50;
    sheet.style.setProperty('--from-x', Math.max(0, Math.min(100, yuzde)).toFixed(1) + '%');
  } else {
    sheet.style.removeProperty('--from-x');
  }

  state.sheet = kind;
  $('sheetTitle').textContent = title;
  $('sheetBody').innerHTML = body;
  $('sheetBody').scrollTop = 0;
  const f = $('sheetFoot');
  if (foot) { f.innerHTML = foot; f.hidden = false; } else { f.hidden = true; f.innerHTML = ''; }
  $('scrim').classList.add('open');
  $('sheet').classList.add('open');
  document.body.style.overflow = 'hidden';
  arkaPlaniKilitle(true);
  requestAnimationFrame(() => $('sheetClose').focus());
}

function closeSheet() {
  state.sheet = null;
  $('scrim').classList.remove('open');
  $('sheet').classList.remove('open');
  document.body.style.overflow = '';
  arkaPlaniKilitle(false);
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
  if (location.hash.includes('/u/')) history.replaceState(null, '', `#/${DATA.categories[state.page].slug}`);
}

/* ============================================================ tazelik == */
/* Menü masada dakikalarca açık duruyor ve o sırada fiyat değişebiliyor.
   Elimizdeki kopyanın kimliği `surum.json`'dakinden eskiyse yenileme teklif
   ediliyor. Sessizce eski fiyat göstermek bir seçenek değil.

   Ağ yoksa hiçbir şey söylenmiyor: çevrimdışı desteği kaldırıldıktan sonra
   sayfa zaten ağdan geliyor, ekranda duruyorsa fiyatı da o an alınmış
   demektir. Uyarılacak bayat bir kopya yok. */

const BUILD_ID = document.querySelector('meta[name="build-id"]')?.content || '';

function staleGoster(goster) {
  const kutu = $('stale');
  if (!kutu) return;

  if (!goster) { kutu.hidden = true; return; }

  $('staleText').textContent = t().updatedNote;
  const dugme = $('staleAct');
  dugme.textContent = t().refresh;
  dugme.hidden = false;
  kutu.hidden = false;
}

let tazelikCalisiyor = false;

async function tazelikYokla() {
  if (!BUILD_ID || tazelikCalisiyor) return;
  tazelikCalisiyor = true;
  try {
    const kes = new AbortController();
    const zaman = setTimeout(() => kes.abort(), 3000);
    const r = await fetch('surum.json', { cache: 'no-store', signal: kes.signal });
    clearTimeout(zaman);
    if (!r.ok) throw new Error('kötü yanıt');
    const { id } = await r.json();
    staleGoster(Boolean(id) && id !== BUILD_ID);
  } catch {
    // Ağ yok ya da dosya gelmedi. Söylenecek bir şey olmadığı için sessiz:
    // yanlış alarm vermektense hiç konuşmamak daha doğru.
  } finally {
    tazelikCalisiyor = false;
  }
}

function initTazelik() {
  if (!BUILD_ID) return;                 // artifact sürümünde yok

  $('staleAct')?.addEventListener('click', () => location.reload());

  tazelikYokla();
  // Sekmeye dönüldüğünde yeniden bakılıyor.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) tazelikYokla();
  });
  window.addEventListener('online', tazelikYokla);
}

/* ------------------------------------------------------- filter sheet -- */
function openFilters() {
  const seg = (key, label, icon) =>
    `<button data-diet="${key}" aria-pressed="${state.diet === key}">${icon || ''}${esc(label)}</button>`;

  const toggles = DATA.allergens.map((a) => {
    const note = a.declaredOn
      ? t().declaredOn(a.declaredOn)
      : a.possibleOn ? t().possibleOnly(a.possibleOn) : t().noData;
    return `
    <button class="toggle" data-allergen="${esc(a.key)}" aria-pressed="${state.exclude.has(a.key)}">
      <span class="toggle__box">${ICON.check}</span>
      <span class="toggle__label">${esc(state.lang === 'en' ? a.labelEn : a.label)}
        <span class="toggle__note">${esc(note)}</span>
      </span>
    </button>`;
  }).join('');

  const sortRows = SORTS.map((k) => `
    <button class="toggle" data-sort="${k}" aria-pressed="${state.sort === k}">
      <span class="toggle__radio">${ICON.check}</span>
      <span class="toggle__label">${esc(t().sorts[k])}</span>
    </button>`).join('');

  const body = `
    <div class="fsection">
      <h3 class="fsection__title">${esc(t().sortBy)}</h3>
      <div class="toggles toggles--radio" id="sortList" role="radiogroup" aria-label="${esc(t().sortBy)}">${sortRows}</div>
    </div>

    <div class="fsection">
      <h3 class="fsection__title">${esc(t().diet)}</h3>
      <div class="segmented" id="dietSeg" role="group" aria-label="${esc(t().diet)}">
        ${seg('all', t().all)}
        ${seg('vegetarian', t().vegetarian, ICON.leaf)}
        ${seg('vegan', t().vegan, ICON.leaf)}
      </div>
      <div class="note">${ICON.info}<span>${esc(t().autoNote)}</span></div>
    </div>

    <div class="fsection">
      <h3 class="fsection__title">${esc(t().exclude)}</h3>
      <div class="toggles" id="allergenGrid">${toggles}</div>
      <div class="note">${ICON.info}<span>${esc(t().allergenNote)}</span></div>
    </div>
  `;

  const foot = `
    <button class="btn" id="fClear" style="flex:0 0 auto">${esc(t().clear)}</button>
    <button class="btn btn--primary" id="fApply" style="flex:1">${esc(t().show(totalVisible()))}</button>
  `;

  openSheet('filter', t().filter, body, foot);

  const refresh = () => {
    const n = totalVisible();
    const apply = $('fApply');
    apply.textContent = n ? t().show(n) : t().showNone;
    apply.disabled = false;
    renderChrome();
  };

  $('sortList').addEventListener('click', (e) => {
    const b = e.target.closest('[data-sort]');
    if (!b) return;
    state.sort = b.dataset.sort;
    [...$('sortList').children].forEach((x) => x.setAttribute('aria-pressed', x.dataset.sort === state.sort));
    refresh();
  });

  $('dietSeg').addEventListener('click', (e) => {
    const b = e.target.closest('[data-diet]');
    if (!b) return;
    state.diet = b.dataset.diet;
    [...$('dietSeg').children].forEach((x) => x.setAttribute('aria-pressed', x.dataset.diet === state.diet));
    refresh();
  });

  $('allergenGrid').addEventListener('click', (e) => {
    const b = e.target.closest('[data-allergen]');
    if (!b) return;
    const k = b.dataset.allergen;
    if (state.exclude.has(k)) state.exclude.delete(k); else state.exclude.add(k);
    b.setAttribute('aria-pressed', state.exclude.has(k));
    refresh();
  });

  $('fClear').addEventListener('click', () => { resetFilters(); closeSheet(); });
  $('fApply').addEventListener('click', () => {
    if (!visibleIn(DATA.categories[state.page]).length) {
      const i = nextMatchingIndex();
      if (i != null) state.page = i;
    }
    closeSheet();
    render();
    syncHash();          // the auto-jump must be reflected in the URL
  });
}

function resetFilters() {
  state.diet = 'all';
  state.exclude.clear();
  state.sort = 'menu';
  render();
}

/* ------------------------------------------------------- detail sheet -- */

// Gramaj/kalori kutuları seçili boya ait. Bir boyda girilmiş, ötekinde
// girilmemiş olabiliyor (KAŞARLI KÖFTE'nin tam porsiyonunda gramaj yok):
// kutu boya göre görünüp kaybolsa seçici her dokunuşta yerinden oynardı, o
// yüzden herhangi bir boyda varsa kutu hep duruyor, olmayanda "—" yazıyor.
function factsHTML(p, sel) {
  const has = (k) => (p.portions ? p.portions.some((x) => x[k]) : !!p[k]);
  const box = (k, label) => {
    if (!has(k)) return '';
    const v = (sel ? sel[k] : p[k]) || '—';
    return `<div class="fact"><div class="fact__k">${esc(label)}</div><div class="fact__v">${esc(v)}</div></div>`;
  };
  const out = box('grams', t().grams) + box('kcal', t().kcal);
  return out ? `<div class="facts">${out}</div>` : '';
}

/* Kalori kaynakta yok, tahmin. Diyet etiketlerinde olduğu gibi burada da
   yazıyla söyleniyor: kesinmiş gibi duran bir sayı, hiç olmamasından kötü.

   Kutuların içinde değil, yanında: boy değişince yalnız `.facts` tazeleniyor
   (bkz. portionApply) ve not orada dursaydı her dokunuşta bir kopyası daha
   birikirdi. Notun boya göre değişen bir yanı da yok. */
const kcalNoteHTML = (p) =>
  (p.portions ? p.portions.some((x) => x.kcal) : !!p.kcal)
    ? `<div class="note note--bare">${ICON.info}<span>${esc(t().kcalNote)}</span></div>` : '';

function portionsHTML(p, i) {
  if (!p.portions) return '';
  const kind = p.portionKind;
  const title = kind === 'people' ? t().portionsPeople
    : kind === 'volume' ? t().portionsSize : t().portions;
  const buttons = p.portions.map((x, k) => `
    <button data-portion="${k}" aria-pressed="${k === i}"
      aria-label="${esc(`${portionA11y(x, kind)} · ${fmtPrice(x.price)}`)}">
      <span class="portion__k">${esc(portionLabel(x, kind))}</span>
      <span class="portion__p">${esc(fmtPrice(x.price))}</span>
    </button>`).join('');
  return `
    <div class="dsection dsection--portions">
      <h4 class="dsection__title">${esc(title)}</h4>
      <div class="portions" style="--n:${p.portions.length}" role="group"
        aria-label="${esc(title)}">${buttons}</div>
    </div>`;
}

// Seçim değiştiğinde kartın tamamı yeniden çizilmiyor: fotoğraf yeniden
// yüklenir, açılış animasyonu kesilir, odak kaybolurdu. Yalnız değişen üç şey
// tazeleniyor — fiyat, kutular ve basılı düğme.
function portionApply(kart, p, i) {
  const sel = p.portions[i];
  kart._pick = i;
  const fiyat = kart.querySelector('.detail__price');
  if (fiyat) fiyat.textContent = fmtPrice(sel.price);
  const eski = kart.querySelector('.facts');
  const yeni = factsHTML(p, sel);
  if (eski && yeni) eski.outerHTML = yeni;
  kart.querySelectorAll('[data-portion]').forEach((b) =>
    b.setAttribute('aria-pressed', String(Number(b.dataset.portion) === i)));
}

function productBody(p, c, pick) {
  const i = p.portions ? (pick ?? p.pick) : -1;
  const sel = p.portions ? p.portions[i] : null;

  const badges = [];
  if (p.popular) badges.push(`<span class="chip chip--badge">${ICON.star}${esc(t().popular)}</span>`);
  if (p.chef)    badges.push(`<span class="chip chip--badge">${ICON.hat}${esc(t().chef)}</span>`);

  const body = `
    ${imgTag(p.image, nameOf(p), 'detail__hero', null, true)}
    <div class="detail__top">
      <h3 class="detail__name">${esc(nameOf(p))}</h3>
      <span class="detail__price">${esc(sel ? fmtPrice(sel.price) : priceText(p))}</span>
    </div>
    ${portionsHTML(p, i)}
    ${badges.length ? `<div class="chiprow" style="margin-top:10px">${badges.join('')}</div>` : ''}
    ${descOf(p) ? `<p class="detail__desc">${esc(descOf(p))}</p>` : ''}
    ${factsHTML(p, sel)}
    ${kcalNoteHTML(p)}

    ${p.diet ? `
      <div class="dsection">
        <h4 class="dsection__title">${esc(t().diet)}</h4>
        <div class="chiprow">${dietChip(p)}</div>
        <div class="note">${ICON.info}<span>${esc(t().autoTag)} · ${esc(p.dietReason)}</span></div>
      </div>` : ''}

    ${p.allergens.length || p.possible.length ? `
      <div class="dsection">
        <h4 class="dsection__title">${esc(t().allergens)}</h4>
        ${p.allergens.length ? `<div class="chiprow">${p.allergens.map((k) =>
          `<span class="chip chip--warn">${ICON.alert}${esc(allergenLabel(k))}</span>`).join('')}</div>` : ''}
        ${p.possible.length ? `
          <div class="chiprow" style="margin-top:8px">${p.possible.map((k) =>
            `<span class="chip">${esc(allergenLabel(k))} · ${esc(t().possible)}</span>`).join('')}</div>
          <div class="note">${ICON.info}<span>${esc(t().possibleNote)}</span></div>` : ''}
      </div>` : ''}

    <div class="dsection">
      <h4 class="dsection__title">${esc(t().categories)}</h4>
      <div class="chiprow"><span class="chip">${esc(nameOf(c))}</span></div>
    </div>
  `;

  return body;
}

/* ---------------------------------------------------- kartlar arası geçiş */

/* Açık kartın komşuları: kart hangi listeden açıldıysa o liste. Aramadaysa
   sonuçlar, kategorideyse kategorinin görünen ürünleri — filtre ve sıralama
   dahil, yani şeritteki sıra ekrandaki sırayla birebir aynı. Alt başlıklar da
   sırayı değiştirmiş oluyor, çünkü menü sırası artık gruplu sıra.

   Destedeki (öne çıkanlar) karta şerit çizilmiyor: deste kendi ok
   düğmeleriyle zaten dönüyor ve kartları sahnede mutlak konumlu duruyor. */
function cardNeighbours() {
  const hits = searchHits();
  if (hits) return hits;
  if (state.view !== 'category') return [];
  const c = DATA.categories[state.page];
  return visibleIn(c).map((p) => ({ p, c }));
}

/* Şerit. Komşunun adı düğmenin üstünde yazıyor: nereye gittiğini görmeden
   basılan bir ok, kartı kapatıp listeye dönmekten iyi değil.

   Kart bir `<button>`; içine `<button>` koymak ayrıştırıcıya dıştakini
   kapattırıyor. Kapatma düğmesi de bu yüzden `role="button"` taşıyan bir
   span — şerit aynı yolu izliyor. */
function cardNavHTML(p) {
  const liste = cardNeighbours();
  const i = liste.findIndex((x) => x.p.id === p.id);
  if (i < 0 || liste.length < 2) return '';

  const yan = (yon, cls, ikon) => {
    const komsu = liste[i + yon];
    const ad = komsu ? nameOf(komsu.p) : '';
    const nitelik = komsu
      ? `role="button" tabindex="0" data-step="${yon}" `
        + `aria-label="${esc(`${yon < 0 ? t().prev : t().next}: ${ad}`)}"`
      : 'data-off="1" aria-hidden="true"';
    return `<span class="cardnav__btn ${cls}" ${nitelik}>${ikon}`
      + `<span class="cardnav__lbl">${esc(ad)}</span></span>`;
  };

  return `<span class="cardnav">
    ${yan(-1, 'cardnav__btn--prev', ICON.chevBack)}
    <span class="cardnav__at">${esc(t().of(i + 1, liste.length))}</span>
    ${yan(1, 'cardnav__btn--next', ICON.chev)}
  </span>`;
}

/* Komşuya geçiş. Açık kartın içeriğini değiştirmek yerine kart kapanıp
   komşusu açılıyor: kart aslında ızgaradaki karonun ta kendisi ve içeriği
   değiştirilseydi kapanınca yanlış ürünün yerine otururdu.

   Arada kilit bilerek kalkıyor — hedef kart görünür yere getiriliyor ki kart
   kapatıldığında misafir baktığı yemeğin yanında kalsın, listenin başında
   değil. Perde ve gövde kilidi aynı kare içinde kapanıp açıldığı için
   ekranda bir kırpışma olmuyor. */
let kartAtlama = false;

function cardStep(yon) {
  const kart = acikKart;
  if (!kart || kartAtlama) return;
  const simdi = findProduct(kart.dataset.product);
  if (!simdi) return;

  const liste = cardNeighbours();
  const i = liste.findIndex((x) => x.p.id === simdi.p.id);
  const hedef = i >= 0 ? liste[i + yon] : null;
  if (!hedef) return;

  const el = $('page').querySelector(`.card[data-product="${hedef.p.id}"]`);
  if (!el) return;

  kartAtlama = true;
  cardClose(kart, false);
  el.scrollIntoView({ block: 'center', behavior: 'auto' });
  cardOpen(el, hedef.p.id, yon);
  kartAtlama = false;
}

// Boylar tek ürüne katlanmadan önce her biri kendi kimliğiyle paylaşılabiliyordu.
// O bağlantılar hâlâ dolaşımda: "…/u/<2lik-id>" gelirse yemek açılıyor ve
// gönderenin kastettiği boy seçili geliyor.
const findProduct = (id) => {
  for (const c of DATA.categories) {
    const p = c.products.find((x) => x.id === id);
    if (p) return { p, c, pick: null };
  }
  for (const c of DATA.categories)
    for (const p of c.products) {
      const i = p.portions ? p.portions.findIndex((x) => x.id === id) : -1;
      if (i >= 0) return { p, c, pick: i };
    }
  return null;
};

/* Kart yerinde genişliyor.
 *
 * Izgara genişliği CSS ile animasyon edilemiyor: `grid-column` değişince
 * tarayıcı yeni yerleşimi tek karede uyguluyor. O yüzden FLIP — kartın
 * nereden nereye gittiği ölçülüp aradaki fark `transform` ile kapatılıyor,
 * sonra sıfıra çekiliyor. Tarayıcının görmediği tek şey aradaki yol.
 *
 * Ölçek kullanılıyor, genişlik değil: genişlik animasyonu her karede
 * yeniden yerleşim demek, ölçek yalnızca birleştirme. İçerik ezilmesin diye
 * ayrıntı bölümü kendi opaklığıyla, kart yerine oturduktan sonra geliyor. */
let acikKart = null;

/** FLIP'i oynatır ve sonunda kartı dinlenme duruşuna bırakır. */
function flipPlay(kart, ilk, son, sure, egri) {
  /* Kartın oturacağı yerdeki kendi dönüşümü. Izgarada bu boş — kart olduğu
     yerde durur — ama destede sahnedeki duruşun ta kendisi: hangi basamakta
     duracaksa onun `translate3d/rotateY/scale`'i (bkz. coverPose).

     Animasyonun sonunda dönüşüm körü körüne siliniyordu. Merkezdeki kartın
     duruşu kimlik olduğu için çoğu zaman görünmüyordu; deste kart açıkken bir
     adım dönmüşse kapanan kart sahnedeki yerini kaybediyor, merkeze yığılıyor
     ve kendi basamağı boş kalıyordu — deste bir sonraki dönüşe kadar eksik
     kartla duruyordu.

     Gidiş dönüşümü duruşun ÜSTÜNE yazılıyor: `son` zaten duruş uygulanmışken
     ölçüldü, aradaki farkın ondan sonra binmesi gerekiyor. */
  const durus = kart.style.transform;
  const temizle = () => { kart.style.transition = ''; kart.style.transform = durus; };
  if (REDUCED || !ilk || !son) { temizle(); return; }

  kart.style.transition = 'none';
  kart.style.transform =
    `translate(${ilk.left - son.left}px, ${ilk.top - son.top}px) ` +
    `scale(${ilk.width / son.width}, ${ilk.height / son.height}) ${durus}`;

  // Emniyet, kare döngüsünün DIŞINDA: requestAnimationFrame arka plandaki bir
  // sekmede hiç çağrılmıyor ve emniyet onun içindeyken o da çalışmıyordu —
  // kart ters çevrilmiş transform'da donup kalıyordu. Zamanlayıcı kısılsa
  // bile er geç koşar; kartın yanlış boyutta kalmaması buna bağlı.
  setTimeout(temizle, sure + 200);

  requestAnimationFrame(() => {
    kart.style.transition = `transform ${sure}ms ${egri}`;
    kart.style.transform = durus;
    kart.addEventListener('transitionend', temizle, { once: true });
  });
}


function cardClose(kart, animasyonlu = true) {
  if (!kart) return;
  const detay = kart.querySelector('.card__detail');
  const kapat = kart.querySelector('.card__close');
  // Şerit de kartın kendi çocuğu: kalırsa ızgaradaki karonun altında öylece
  // durur.
  const serit = kart.querySelector('.cardnav');

  /* "Açık kart" burada bitiyor, kart yerine konmadan önce: destenin yeniden
     dönmesi buna bakıyor ve kartı yerine koyan adım desteyi serbest
     bırakıyor. Sonra temizlenseydi deste bir daha hiç dönmezdi. */
  const buydu = acikKart === kart;
  if (buydu) acikKart = null;

  if (!animasyonlu || REDUCED) {
    detay?.remove(); kapat?.remove(); serit?.remove();
    kart.classList.remove('card--open');
    diyalogNitelikleriniSok(kart);
    kart.style.transform = '';
    kart.style.transition = '';
    kartiYerineKoy(kart);
    if (buydu) { kartKilit(false); kartOdagiGeriVer(kart); }
    return;
  }

  const ilk = kart.getBoundingClientRect();
  // Ölçüm, kapanmış hâli görmeli — bu yüzden içerik önce çıkarılıyor.
  detay?.remove(); kapat?.remove(); serit?.remove();
  kart.classList.remove('card--open');
  diyalogNitelikleriniSok(kart);
  kartiYerineKoy(kart);
  const son = kart.getBoundingClientRect();

  flipPlay(kart, ilk, son, 360, 'var(--ease)');
  if (buydu) { kartKilit(false); kartOdagiGeriVer(kart); }
  syncHash();
}

/** Kartı ızgaradaki yerine geri koyar. */
function kartiYerineKoy(kart) {
  if (!kart._yer || !kart._yer.parentNode) return;
  kart._yer.parentNode.insertBefore(kart, kart._yer);
  kart._yer.remove();
  kart._yer = null;
  if (kart.classList.contains('pick3d__card')) {
    // Deste kendi konumlarını yeniden kursun, sonra dönmeye devam etsin.
    layoutCover(false);
    resumeCover();
  }
}

let kilitliY = 0;
let kartOncekiOdak = null;

/* Perde arkasındaki her şeyi klavyeden ve ekran okuyucudan çıkarır.
   `inert` elle kurulan bir odak tuzağının yerini tutuyor ve daha doğrusunu
   yapıyor: yalnızca Sekme'yi değil, okuyucunun kendi gezinme komutlarını da
   dışarıda tutuyor. Kart `document.body`ye taşındığı için bunlar kardeşi
   oluyor ve kapsam dışında kalıyor. */
function arkaPlaniKilitle(ac) {
  for (const sec of ['.app', '.pager']) {
    const el = document.querySelector(sec);
    if (el) el.inert = ac;
  }
}

function diyalogNitelikleriniSok(kart) {
  kart.removeAttribute('role');
  kart.removeAttribute('aria-modal');
  kart.removeAttribute('aria-labelledby');
  kart.setAttribute('aria-expanded', 'false');
}

/* Odak, kartın açıldığı yere döner. Dönmezse imleç belgenin başına düşer ve
   kullanıcı listede kaldığı yeri baştan bulmak zorunda kalır. */
function kartOdagiGeriVer(kart) {
  arkaPlaniKilitle(false);
  const hedef = kart?.isConnected ? kart
    : (kartOncekiOdak?.isConnected ? kartOncekiOdak : null);
  kartOncekiOdak = null;
  if (hedef) requestAnimationFrame(() => hedef.focus({ preventScroll: true }));
}

function kartKilit(ac) {
  const b = document.body;
  if (ac) {
    kilitliY = window.scrollY;
    b.style.position = 'fixed';
    b.style.top = `-${kilitliY}px`;
    b.style.left = '0';
    b.style.right = '0';
    b.style.overflow = 'hidden';
  } else {
    b.style.position = '';
    b.style.top = '';
    b.style.left = '';
    b.style.right = '';
    b.style.overflow = '';
    // Sabitlemeyi kaldırmak sayfayı en üste atıyor; kullanıcıyı bıraktığı
    // yere geri koyuyoruz.
    window.scrollTo(0, kilitliY);
  }
  document.body.classList.toggle('kart-acik', ac);
  $('cardVeil').classList.toggle('on', ac);
}

function cardOpen(kart, id, adim = 0) {
  const bulunan = findProduct(id);
  if (!bulunan) return;
  const { p, c, pick } = bulunan;

  if (acikKart && acikKart !== kart) cardClose(acikKart, false);

  const ilk = kart.getBoundingClientRect();

  // Nereye döneceğini bilsin diye yerine görünmez bir işaret bırakılıyor.
  const desteMi = kart.classList.contains('pick3d__card');
  const yer = desteMi
    ? Object.assign(document.createElement('span'),
        { className: 'pick3d__card', style: 'visibility:hidden;pointer-events:none' })
    : document.createComment('kart-yeri');
  kart.parentNode.insertBefore(yer, kart);
  kart._yer = yer;
  // Sahnenin bıraktığı inline katman, saydamlık ve duruş açık kartta anlamını
  // yitiriyor ve CSS'i eziyor. Duruş özellikle: ölçüm bundan sonra yapılıyor
  // ve sahnedeki eğimiyle ölçülen bir kart, açılış animasyonuna yanlış hedef
  // veriyor.
  kart.style.zIndex = '';
  kart.style.opacity = '';
  kart.style.transform = '';
  document.body.appendChild(kart);

  kart.classList.add('card--open');
  /* Artık ekranın tamamını kaplayan, arkasını perdeleyen bir katman: rolü de
     bunu söylemeli. Başlığını kendi ürün adından alıyor. */
  kart.setAttribute('role', 'dialog');
  kart.setAttribute('aria-modal', 'true');
  kart.setAttribute('aria-labelledby', 'ad-' + p.id);
  kart.setAttribute('aria-expanded', 'true');
  kart._pick = p.portions ? (pick ?? p.pick) : null;
  kart.insertAdjacentHTML('beforeend',
    `<span class="card__detail">${productBody(p, c, kart._pick)}</span>`);
  kart.insertAdjacentHTML('beforeend', cardNavHTML(p));
  kart.insertAdjacentHTML('beforeend',
    `<span class="card__close" role="button" tabindex="0" aria-label="${esc(t().close)}">
       <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
     </span>`);

  const son = kart.getBoundingClientRect();
  acikKart = kart;
  kartKilit(true);
  arkaPlaniKilitle(true);
  // Odak kartın içine giriyor; dönüş adresi de saklanıyor.
  kartOncekiOdak = document.activeElement;
  requestAnimationFrame(() => kart.querySelector('.card__close')?.focus());
  history.replaceState(null, '', `#/${c.slug}/u/${p.id}`);

  // Komşuya geçiş: kart zaten açıktı, karodan büyüme animasyonu tekrarlanmıyor.
  // Gelen kart gidilen yönden kayıyor — hangi yöne gidildiği animasyonun
  // kendisinden okunuyor.
  if (adim) {
    if (REDUCED) return;
    const sinif = adim > 0 ? 'card--step-next' : 'card--step-prev';
    kart.classList.add(sinif);
    kart.addEventListener('animationend',
      () => kart.classList.remove(sinif), { once: true });
    return;
  }

  // Hafif aşma: kart yerine oturmadan önce bir tık geçiyor. Destedeki kart
  // daha yaylı, ızgaradaki daha ölçülü.
  const desteden = kart.classList.contains('pick3d__card');
  flipPlay(kart, ilk, son,
    desteden ? 540 : 460,
    desteden ? 'cubic-bezier(.16, 1.32, .4, 1)' : 'cubic-bezier(.2, 1.16, .36, 1)');

}

const cardToggle = (kart, id) =>
  kart.classList.contains('card--open') ? cardClose(kart) : cardOpen(kart, id);

/* The category-index sheet was replaced by the home page, which shows every
   category at once. */

/* ------------------------------------------------------ language sheet - */
function openLanguages() {
  const body = `
    <div class="toggles toggles--radio" id="langList" role="radiogroup" aria-label="${esc(t().language)}">
      ${LANGS.map((l) => `
        <button class="toggle" data-lang="${l.code}" aria-pressed="${state.lang === l.code}" lang="${l.code}">
          <span class="toggle__radio">${ICON.check}</span>
          <span class="toggle__label">${esc(l.label)}</span>
        </button>`).join('')}
    </div>`;

  openSheet('lang', t().language, body);
  $('langList').addEventListener('click', (e) => {
    const b = e.target.closest('[data-lang]');
    if (!b) return;
    state.lang = b.dataset.lang;
    persist();
    closeSheet();
    render();
  });
}

/* ---------------------------------------------------------- info sheet - */
function openInfo() {
  const r = DATA.restaurant;
  const rows = [];
  rows.push(`<div class="inforow">${ICON.clock}<span class="inforow__k">${esc(t().hours)}</span><span class="inforow__v"><bdi dir="ltr">${esc(r.hours || '—')}</bdi></span></div>`);
  if (r.phone) rows.push(`<a class="inforow" href="tel:${esc(r.phone.replace(/\s/g, ''))}">${ICON.phone}<span class="inforow__k">${esc(t().phone)}</span><span class="inforow__v">${esc(r.phone)}</span></a>`);
  if (r.city) rows.push(`<div class="inforow">${ICON.pin}<span class="inforow__k">${esc(t().address)}</span><span class="inforow__v">${esc([r.district, r.city].filter(Boolean).join(', '))}</span></div>`);
  if (r.maps) rows.push(`<a class="inforow" href="${esc(r.maps)}" target="_blank" rel="noopener">${ICON.pin}<span class="inforow__k">${esc(t().maps)}</span><span class="inforow__v">${ICON.chev}</span></a>`);
  if (r.instagram) rows.push(`<a class="inforow" href="${esc(r.instagram)}" target="_blank" rel="noopener">${ICON.ig}<span class="inforow__k">Instagram</span><span class="inforow__v">${ICON.chev}</span></a>`);
  if (r.tiktok) rows.push(`<a class="inforow" href="${esc(r.tiktok)}" target="_blank" rel="noopener">${ICON.tiktok}<span class="inforow__k">TikTok</span><span class="inforow__v">${ICON.chev}</span></a>`);

  // Only shown once there is a score to show — "0.0" reads as a bad rating,
  // not as "not rated yet".
  if (r.rating > 0) {
    rows.push(`<div class="inforow">${ICON.google}<span class="inforow__k">${esc(t().rating)}</span>`
      + `<span class="inforow__v">${'★'.repeat(Math.round(r.rating))}${'☆'.repeat(5 - Math.round(r.rating))}`
      + ` ${r.rating.toFixed(1)}${r.reviews ? ` · ${esc(t().reviewCount(r.reviews))}` : ''}</span></div>`);
  }
  if (r.googleReview) rows.push(`<a class="inforow" href="${esc(r.googleReview)}" target="_blank" rel="noopener">${ICON.google}<span class="inforow__k">${esc(t().rateOnGoogle)}</span><span class="inforow__v">${ICON.chev}</span></a>`);

  // Theme has moved to the top bar. Language stays here: it is chosen once on
  // arrival, where the theme gets reached for mid-meal.
  rows.push(`<button class="inforow" id="iLang">${ICON.globe}<span class="inforow__k">${esc(t().language)}</span><span class="inforow__v">${esc(langInfo(state.lang).label)}</span></button>`);

  openSheet('info', r.name, rows.join(''));

  $('iLang').addEventListener('click', openLanguages);
}

// Location, socials and the Google review ask, in one place. TikTok appears
// only once the panel stores a URL for it — there is no field yet.
function socialLinksHTML() {
  const r = DATA.restaurant;
  const a = (href, label, icon, cls = '') =>
    `<a href="${esc(href)}" target="_blank" rel="noopener" aria-label="${esc(label)}" class="${cls}">${icon}</a>`;

  const out = [];
  if (r.maps) out.push(a(r.maps, t().maps, ICON.pin));
  if (r.instagram) out.push(a(r.instagram, 'Instagram', ICON.ig));
  if (r.tiktok) out.push(a(r.tiktok, 'TikTok', ICON.tiktok));
  /* Puan varsa bağlantı onu gösteriyor, yoksa değerlendirme daveti kalıyor.
     Puan bir iddia: uydurulmuş ya da eski bir sayı, hiç göstermemekten daha
     kötü. Veri sıfırsa alan hiç çizilmiyor. */
  if (r.googleReview) {
    const puan = Number(r.rating) || 0;
    const adet = Number(r.reviews) || 0;
    const govde = puan > 0
      ? `${ICON.google}<span>${esc(puan.toLocaleString(langInfo(state.lang).locale, { minimumFractionDigits: 1, maximumFractionDigits: 1 }))}</span>` +
        (adet > 0 ? `<i class="cover__count">(${esc(adet.toLocaleString(langInfo(state.lang).locale))})</i>` : '')
      : `${ICON.google}<span>${esc(t().rate)}</span>`;
    const etiket = puan > 0
      ? `${t().rateOnGoogle} — ${puan.toFixed(1)}${adet ? ` (${adet})` : ''}`
      : t().rateOnGoogle;
    out.push(a(r.googleReview, etiket, govde,
      'cover__review' + (puan > 0 ? ' cover__review--puanli' : '')));
  }
  return out.join('');
}

/* ============================================================== cover === */

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

// These clips are 5.4 MB each. A guest opening the menu on restaurant wi-fi
// should never wait on one, so video is opt-out on any signal that bandwidth
// is precious — and stills always carry the screen on their own.
const CONN = navigator.connection || {};
const LIGHT_MEDIA = REDUCED
  || CONN.saveData === true
  || /^(slow-)?2g$/.test(CONN.effectiveType || '')
  || CONN.effectiveType === '3g';

// Rotating cover: each slide holds for its own duration, video slides play
// through. Mounted once so paging never interrupts playback.
// One clip, looping. The still is only a fallback for when the video cannot
// or should not load — never a second slide in a rotation.
function initCover() {
  const slides = DATA.restaurant.slides || [];
  const clip = slides.find((s) => s.type === 'video' && clipSrc(s.src));
  const still = slides.find((s) => s.type === 'image') || (DATA.restaurant.cover ? { src: DATA.restaurant.cover } : null);
  if (!clip && !still) return;

  const wrap = $('cover');
  wrap.hidden = false;

  const r = DATA.restaurant;
  $('coverPlace').textContent = [r.district, r.city].filter(Boolean).join(', ');
  $('coverCount').textContent = '';
  $('coverLinks').innerHTML = socialLinksHTML();

  const shade = wrap.querySelector('.cover__shade');
  const useVideo = clip && !LIGHT_MEDIA;

  if (!useVideo) {
    if (!still) return;
    const img = new Image();
    img.className = 'cover__slide on';
    img.alt = '';
    img.decoding = 'async';
    img.src = still.src;
    wrap.insertBefore(img, shade);
    return;
  }

  const v = document.createElement('video');
  v.className = 'cover__slide on';
  v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true;
  v.setAttribute('playsinline', '');
  v.setAttribute('muted', '');
  v.preload = 'auto';
  if (clip.darkness) v.style.filter = `brightness(${1 - clip.darkness / 100})`;
  v.src = clipSrc(clip.src);
  wrap.insertBefore(v, shade);
  v.play().catch(() => {});

  // If the clip never arrives, the poster is already showing — but stop
  // holding a stalled download open.
  v.addEventListener('error', () => { v.removeAttribute('src'); v.load(); });

  // Don't decode video for a tab nobody is looking at.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) v.pause(); else v.play().catch(() => {});
  });
}

/* ============================================================= splash === */

// Shown on arrival — this is a QR code landing, and the first thing a guest
// should see is which restaurant they are in. Skipped when the URL points at
// a specific dish, because that is a shared link with its own destination.
function initSplash() {
  const r = DATA.restaurant;
  const w = r.welcome;
  const el = $('splash');
  if (/\/u\//.test(location.hash)) return false;

  el.hidden = false;
  splashUp = true;
  document.body.style.overflow = 'hidden';

  // The uploaded welcome clip is the whole point of this screen.
  const clip = clipSrc(w?.media);
  const isVideo = w?.kind === 'video' && !!clip && !LIGHT_MEDIA;
  const src = isVideo ? clip : r.cover;

  if (src) {
    let bg;
    if (isVideo) {
      bg = document.createElement('video');
      bg.muted = true; bg.loop = true; bg.autoplay = true; bg.playsInline = true;
      bg.setAttribute('playsinline', '');
      bg.setAttribute('muted', '');
      bg.preload = 'auto';
      // No poster: the clip is inlined, and a still flashing first is exactly
      // what reads as "a photo, not a video".
    } else {
      bg = new Image();
      bg.alt = '';
      bg.decoding = 'async';
    }
    bg.className = 'splash__bg';
    bg.src = src;
    el.prepend(bg);
    if (isVideo) bg.play().catch(() => {});
  }

  // Overlay colour, opacity and gradient all come from the restaurant's own
  // settings; only the falloff is ours, so the footage stays visible.
  const ov = w?.overlay || { color: '#ffffff', opacity: 70 };
  // The stored setting is 88% — a wash that hides the footage completely.
  // Treated as an upper bound and pulled right down: just enough to hold the
  // type, with the clip left clearly visible.
  // The stored overlay is 88% white — a wash that hides the clip entirely.
  // We keep the footage visible instead, which means the veil is far too
  // thin to carry dark type: over video, light-on-dark is the only reliable
  // combination, so the scrim is always dark regardless of the stored colour.
  const strong = Math.min(0.52, Math.max(0.34, (ov.opacity ?? 70) / 200));
  const soft = strong * 0.42;

  el.style.setProperty('--veil-strong', `rgba(10,9,8,${strong})`);
  el.style.setProperty('--veil-soft', `rgba(10,9,8,${soft})`);
  el.style.setProperty('--splash-ink', '#FFFFFF');
  el.style.setProperty('--splash-ink-2', 'rgba(255,255,255,.88)');
  el.style.setProperty('--splash-paper', '#0E0D0C');
  el.style.setProperty('--splash-chip', 'rgba(255,255,255,.18)');
  el.style.background = '#0E0D0C';
  if (w?.logoSize) el.style.setProperty('--welcome-logo', `${Math.round(w.logoSize * 0.62)}px`);

  $('splashLogo').outerHTML = imgTag(w?.logo || r.logo, r.name, 'splash__logo')
    .replace('class="splash__logo"', 'class="splash__logo" id="splashLogo"');
  // A dedicated welcome logo already carries the name — don't set it twice.
  if (w?.logo) $('splashName').hidden = true;
  else $('splashName').textContent = r.name;
  $('splashMeta').innerHTML =
    `<i class="dot ${r.isOpen ? 'dot--open' : 'dot--closed'}"></i>`
    + `${esc(r.isOpen ? t().openNow : t().closedNow)}`
    + (r.hours ? ` · ${esc(r.hours)}` : '')
    + ([r.district, r.city].filter(Boolean).length ? ` · ${esc([r.district, r.city].filter(Boolean).join(', '))}` : '');

  $('splashCtaLabel').textContent = w?.buttonText || t().viewMenu;

  const links = [];
  if (r.maps) links.push(`<a href="${esc(r.maps)}" target="_blank" rel="noopener" aria-label="${esc(t().maps)}">${ICON.pin}</a>`);
  if (r.instagram) links.push(`<a href="${esc(r.instagram)}" target="_blank" rel="noopener" aria-label="Instagram">${ICON.ig}</a>`);
  if (r.phone) links.push(`<a href="tel:${esc(r.phone.replace(/\s/g, ''))}" aria-label="${esc(t().phone)}">${ICON.phone}</a>`);
  $('splashLinks').innerHTML = links.join('');

  const dismiss = () => {
    el.dataset.out = '';
    document.body.style.overflow = '';
    splashUp = false;

    // Runs alongside the splash's own fade, so the two read as one movement.
    if (!REDUCED) {
      /* Giriş animasyonu bitince sınıflar kaldırılıyor.
         `both` dolgusu, animasyon bittikten sonra da transform'u üzerinde
         bırakıyordu ve transform taşıyan bir ata, içindeki `position: fixed`
         öğeleri viewport yerine kendine göre konumlandırıyor. Açık ürün kartı
         bu yüzden ekranın dışında açılıyordu — giriş animasyonundan kalan
         12 pikselik bir transform yüzünden. */
      const girisBitir = (el, sinif) => {
        el.classList.add(sinif);
        const temizle = () => el.classList.remove(sinif);
        el.addEventListener('animationend', temizle, { once: true });
        setTimeout(temizle, 1200);   // animasyon hiç koşmazsa da kalkmalı
      };
      girisBitir(document.querySelector('.app'), 'app--enter');
      girisBitir($('pager'), 'pager--enter');
    }
    // Released now rather than after the splash is hidden, so the tiles are
    // already settling in as it fades — one entrance, not two.
    applyMotion();

    setTimeout(() => {
      el.hidden = true;
      el.querySelector('video')?.pause();   // free the decoder once hidden
    }, 540);
  };
  $('splashCta').addEventListener('click', dismiss);
  requestAnimationFrame(() => $('splashCta').focus());
  return true;
}

/* ============================================================== routing = */
const syncHash = () => history.replaceState(null, '',
  state.view === 'home' ? '#/' : `#/${DATA.categories[state.page].slug}`);

// Instant, never smooth. Both callers play a directional page animation at the
// same moment, and animating the scroll position underneath a page that is
// translating sideways is what made switching category feel like it caught.
// Arriving at the top is not something to animate — the slide already says a
// new page came in.
const scrollTop = () => window.scrollTo({ top: 0, behavior: 'auto' });

/* Giden sayfa için bekleme yok: soldurmak ekranı bir an boşaltıyordu. Yeni
   içerik anında kuruluyor, farkı giriş animasyonu kapatıyor. */

function go(i) {
  const next = Math.max(0, Math.min(DATA.categories.length - 1, i));
  if (state.view === 'category' && next === state.page) return;

  state.dir = state.view === 'home' ? 1 : (next > state.page ? 1 : -1);
  state.page = next;
  state.view = 'category';
  syncHash();
  // Before the render, so the new page is measured where it will actually sit.
  scrollTop();
  render();
}

function goHome() {
  if (state.view === 'home') return;
  state.dir = -1;
  state.view = 'home';
  syncHash();
  scrollTop();
  render();
}

function readHash(first) {
  const m = location.hash.match(/^#\/([^/]+)(?:\/u\/([^/]+))?/);
  if (!m) { state.view = 'home'; return; }

  const i = DATA.categories.findIndex((c) => c.slug === m[1]);
  const product = m[2];

  // Arriving fresh always starts at the top level. The QR code on the table is
  // a shared door, and a category left in the address by whoever scanned it
  // before is not where the next guest should begin. A link to one dish is a
  // different thing — that was sent deliberately, so it still opens, and it
  // keeps its category underneath so closing it lands somewhere sensible.
  if (i >= 0 && (product || !first)) {
    state.page = i;
    state.view = 'category';
  } else {
    state.view = 'home';
    // Leaving a category in the address while showing the menu would put the
    // two out of step, and the back button with them.
    if (first) history.replaceState(null, '', '#/');
  }

  if (product) setTimeout(() => {
    // Adresteki kimlik katlanmış bir boya ait olabilir; kart grubun kimliğiyle
    // basılı, o yüzden önce yemeğe çevriliyor.
    const hedef = findProduct(product);
    if (!hedef) return;
    const kart = document.querySelector(`.card[data-product="${hedef.p.id}"]`);
    if (kart) { cardOpen(kart, product); kart.scrollIntoView({ block: 'center', behavior: 'auto' }); }
  }, 60);
}

/* =============================================================== wiring = */
function applyTheme() {
  if (state.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', state.theme);
}

const step = (target) => { if (typeof target === 'number') go(target); };
$('indexBtn').addEventListener('click', goHome);
$('themeBtn').addEventListener('click', () => {
  // 'auto' ile başlayan biri, sistemin şu an gösterdiğinin tersine geçer.
  const suAnKoyu = state.theme === 'dark'
    || (state.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  state.theme = suAnKoyu ? 'light' : 'dark';
  persist();
  applyTheme();
  renderChrome();
});

/* Swiping the page is the fastest way through a menu on a phone, and it
   reuses the same directional page animation the rail triggers. */
let touch = null;
$('page').addEventListener('touchstart', (e) => {
  // Deste kendi kaydırmasını yönetiyor; aynı hareket hem kartı hem kategoriyi
  // değiştirseydi ikisi de yanlış zamanda olurdu.
  if (e.target.closest('.pick3d')) { touch = null; pauseCover(); return; }
  touch = e.touches.length === 1
    ? { x: e.touches[0].clientX, y: e.touches[0].clientY }
    : null;
}, { passive: true });

$('page').addEventListener('touchend', (e) => {
  if (!touch || state.sheet) return;
  const dx = e.changedTouches[0].clientX - touch.x;
  const dy = e.changedTouches[0].clientY - touch.y;
  touch = null;

  // Long enough to be deliberate, and clearly more sideways than down — a
  // diagonal flick during a scroll must not change the category.
  if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.5) return;

  // In RTL the menu runs the other way, so the gesture has to follow it.
  const back = getComputedStyle(document.documentElement).direction === 'rtl'
    ? dx < 0 : dx > 0;
  step(back ? pagerTarget.prev : pagerTarget.next);
}, { passive: true });
$('filterBtn').addEventListener('click', openFilters);
$('brandBtn').addEventListener('click', openInfo);
$('langBtn').addEventListener('click', openLanguages);
$('activeClear').addEventListener('click', resetFilters);
$('sheetClose').addEventListener('click', closeSheet);
$('scrim').addEventListener('click', closeSheet);
$('cardVeil').addEventListener('click', () => cardClose(acikKart));

let searchTimer;
$('searchInput').addEventListener('input', (e) => {
  state.query = e.target.value.trim();
  $('searchClear').hidden = !state.query;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderPage, 120);
});
$('searchClear').addEventListener('click', () => {
  state.query = '';
  $('searchInput').value = '';
  $('searchClear').hidden = true;
  renderPage();
  $('searchInput').focus();
});

/* Deste: yön düğmeleri, noktalar ve kendi kaydırma hareketi. */
document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-cnav]');
  if (nav) { coverGo(Number(nav.dataset.cnav)); return; }

  const dot = e.target.closest('[data-cdot]');
  if (dot) { coverTo(Number(dot.dataset.cdot)); return; }

  // Kenardaki karta dokunmak onu ortaya getirir; ürünü açmaz. Ortadaki kart
  // ise ürünü açar — aşağıdaki data-product yakalayıcısına düşüyor.
  const card = e.target.closest('.pick3d__card');
  if (card && !card.classList.contains('is-on')) {
    coverTo(Number(card.dataset.ci));
    e.stopPropagation();
    return;
  }
}, true);

let coverTouch = null;
document.addEventListener('touchstart', (e) => {
  const stage = e.target.closest('.pick3d__stage');
  coverTouch = stage && e.touches.length === 1
    ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (!coverTouch) return;
  const dx = e.changedTouches[0].clientX - coverTouch.x;
  const dy = e.changedTouches[0].clientY - coverTouch.y;
  coverTouch = null;
  if (Math.abs(dx) < 42 || Math.abs(dx) < Math.abs(dy) * 1.4) { resumeCover(); return; }
  const rtl = getComputedStyle(document.documentElement).direction === 'rtl';
  coverGo((dx > 0) === rtl ? 1 : -1);
}, { passive: true });

document.addEventListener('click', (e) => {
  // Komşu ürüne geçiş: kartı kapatan yakalayıcılardan önce.
  const adim = e.target.closest('[data-step]');
  if (adim) { cardStep(Number(adim.dataset.step)); e.stopPropagation(); return; }

  // Boy seçimi: açık kartın içinde, kartı kapatmadan.
  const boy = e.target.closest('[data-portion]');
  if (boy) {
    const kart = boy.closest('[data-product]');
    const bulunan = kart && findProduct(kart.dataset.product);
    if (bulunan?.p.portions) portionApply(kart, bulunan.p, Number(boy.dataset.portion));
    e.stopPropagation();
    return;
  }

  /* Destedeki merkez karta dokunmak, ürünü kendi kategorisinde açar.
     Deste kartları da `data-product` taşıyor ve doğrudan genişletme
     mantığına düşüyorlardı; onlar 3B dönüştürülmüş, sahneye mutlak
     konumlanmış ve kendi `transform`'larını kullanıyor — genişleme de aynı
     özelliği kullandığı için ikisi çakışıyor, kart açılmıyor ama perde
     açık kalıyordu: ekran bulanıklaşıp öylece duruyordu. */
  const pick = e.target.closest('.pick3d__card');
  if (pick) {
    if (pick.classList.contains('card--open')) {
      if (e.target.closest('.card__close')) { cardClose(pick); return; }
      if (e.target.closest('.card__detail')) return;   // içine dokunmak kapatmasın
      cardClose(pick);
      return;
    }
    pauseCover();                 // açıkken deste dönmesin
    cardOpen(pick, pick.dataset.product);
    return;
  }

  const row = e.target.closest('[data-product]');
  if (row) {
    if (e.target.closest('.card__close')) { cardClose(row); return; }
    // Açık kartın içindeki bir şeye dokunulduysa kart kapanmasın.
    if (row.classList.contains('card--open') && e.target.closest('.card__detail')) return;
    cardToggle(row, row.dataset.product);
    return;
  }

  const jump = e.target.closest('[data-goto]');
  if (jump) { closeSheet(); go(+jump.dataset.goto); }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && acikKart) { cardClose(acikKart); return; }
  if (e.key === 'Escape' && state.sheet) { closeSheet(); return; }

  /* `role="button"` taşıyan span'lar Enter ve Boşluk'la kendiliğinden
     tıklanmıyor — gerçek düğme kullanılamıyor, çünkü kartın kendisi bir
     düğme ve iç içe düğme ayrıştırıcıda dıştakini kapatıyor. */
  const sanal = e.target.closest?.('[data-step], .card__close');
  if (sanal && (e.key === 'Enter' || e.key === ' ')) {
    sanal.click();
    e.preventDefault();
    return;
  }

  // Kart açıkken oklar kategoriyi değil, aynı listedeki komşu ürünü getiriyor.
  if (acikKart && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    const rtl = getComputedStyle(document.documentElement).direction === 'rtl';
    cardStep((e.key === 'ArrowRight') !== rtl ? 1 : -1);
    e.preventDefault();
    return;
  }

  if (state.sheet) return;
  if (e.target.matches('input')) return;
  if (e.key === 'ArrowLeft') step(pagerTarget.prev);
  if (e.key === 'ArrowRight') step(pagerTarget.next);
});

/* Açık kartta yatay kaydırma komşuya geçiriyor — telefonda şeride uzanmadan.
   Kart `touch-action: pan-y` olduğu için yatay hareket zaten sayfaya gitmiyor;
   dikey kaydırma kartın kendi içeriğinde kalıyor. */
let kartTouch = null;
document.addEventListener('touchstart', (e) => {
  const kart = e.target.closest?.('.card--open');
  kartTouch = kart && e.touches.length === 1
    ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (!kartTouch) return;
  const dx = e.changedTouches[0].clientX - kartTouch.x;
  const dy = e.changedTouches[0].clientY - kartTouch.y;
  kartTouch = null;
  // Sayfa kaydırmasındaki eşiğin aynısı: kararlı olacak kadar uzun, ve
  // dikeyden açıkça daha yatay.
  if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const rtl = getComputedStyle(document.documentElement).direction === 'rtl';
  cardStep((dx < 0) !== rtl ? 1 : -1);
}, { passive: true });

window.addEventListener('hashchange', () => { readHash(); render(); });

/* Görsel görünüm ölçeği 1'in üstündeyse sayfa yakınlaştırılmış demektir.
   Yalnızca bir sınıf açılıp kapanıyor; ölçüm kaydırma sırasında değil,
   yakınlaştırma değiştiğinde yapılıyor. */
if (window.visualViewport) {
  const zoomDurumu = () => document.documentElement.classList.toggle(
    'zoomed', window.visualViewport.scale > 1.02);
  window.visualViewport.addEventListener('resize', zoomDurumu);
  zoomDurumu();
}

applyTheme();
readHash(true);
render();
// Kapak önce kurulur: yerini baştan alsın ki splash kalkınca sayfa kaymasın.
initCover();
initSplash();
initTazelik();

/* =============================================================== debug === */
// ?debug=1 only. The artefact shows on a phone and not on a desktop, so the
// device has to be the one reporting what moves. Every value is watched for
// its whole range rather than its current reading — a change that lasts two
// frames is impossible to catch by eye, but its range is still there
// afterwards. Anything that moved is highlighted and keeps its min→max.
if (/[?&]debug=1/.test(location.search)) {
  const box = document.createElement('div');
  box.className = 'debugbox';
  document.body.appendChild(box);

  const range = new Map();
  const tick = () => {
    const vv = window.visualViewport;
    const title = document.querySelector('.page__title');
    const cs = title && getComputedStyle(title);
    const rows = [
      ['layoutH ', innerHeight],
      ['visualH ', vv ? Math.round(vv.height) : 0],
      ['vvScale ', vv ? +vv.scale.toFixed(3) : 0],
      ['dpr     ', devicePixelRatio],
      ['titleFnt', cs ? parseFloat(cs.fontSize) : 0],
      ['titleW  ', title ? +title.getBoundingClientRect().width.toFixed(1) : 0],
      ['pageW   ', +$('page').getBoundingClientRect().width.toFixed(1)],
    ];

    box.innerHTML = rows.map(([k, v]) => {
      const r = range.get(k) || { min: v, max: v };
      if (v < r.min) r.min = v;
      if (v > r.max) r.max = v;
      range.set(k, r);
      return r.min === r.max ? `${k} ${v}` : `<b>${k} ${v}  ${r.min}→${r.max}</b>`;
    }).join('\n');

    requestAnimationFrame(tick);
  };
  tick();
}
})();
</script>

</body>
</html>
